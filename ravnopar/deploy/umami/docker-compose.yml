# Umami self-host for Ravnopar (PostgreSQL)
# Dir on VPS: /var/www/Render/ravnopar/deploy/umami
services:
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: ravnopar-umami
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      DATABASE_URL: postgresql://umami:umami@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?set UMAMI_APP_SECRET}
      TRACKER_SCRIPT_NAME: script.js
      DISABLE_TELEMETRY: "1"
      # Comma-separated IPs/CIDR to exclude (owner home IP, office, etc.)
      IGNORE_IP: ${IGNORE_IP:-}
      IGNORE_HOSTNAME: ${IGNORE_HOSTNAME:-}
    depends_on:
      umami-db:
        condition: service_healthy

  umami-db:
    image: postgres:15-alpine
    container_name: ravnopar-umami-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  umami-db-data:
