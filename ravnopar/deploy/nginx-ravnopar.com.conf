# /etc/nginx/sites-enabled/ravnopar
# HTTPS — ravnopar.com + www → apex redirect

server {
    listen 443 ssl;
    server_name ravnopar.com www.ravnopar.com;

    ssl_certificate /etc/letsencrypt/live/ravnopar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ravnopar.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # www → non-www (GSC duplikati)
    if ($host = www.ravnopar.com) {
        return 301 https://ravnopar.com$request_uri;
    }

    client_max_body_size 35m;

    location /media/ {
        proxy_pass http://127.0.0.1:4200/media/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4200/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTP → HTTPS (oba hosta na apex)
server {
    listen 80;
    server_name www.ravnopar.com;
    return 301 https://ravnopar.com$request_uri;
}

server {
    listen 80;
    server_name ravnopar.com;
    return 301 https://ravnopar.com$request_uri;
}
