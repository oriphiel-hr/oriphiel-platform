name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Backend tests
        working-directory: ravnopar/backend
        run: |
          npm install
          node ./node_modules/prisma/build/index.js generate
          npm test
      - name: Frontend build
        working-directory: ravnopar/frontend
        run: |
          npm install
          npm run build
