# Ravnopar — Render Blueprint
# Repo: oriphiel-hr/Render (monorepo)
# Ako su servisi već ručno kreirani, uskladi env varijable u Dashboardu s docs/RENDER-ENV.md

databases:
  - name: ravnopar-db
    plan: free
    region: frankfurt
    databaseName: ravnopar
    user: ravnopar_user

services:
  - type: web
    name: ravnopar-backend
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    rootDir: ravnopar/backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ravnopar-db
          property: connectionString
      - key: FRONTEND_BASE_URL
        value: https://ravnopar.oriph.io
      - key: CORS_ALLOWED_ORIGINS
        value: https://ravnopar.onrender.com
      - key: DAILY_CONTACT_LIMIT
        value: "30"
      - key: FIRST_USER_IS_ADMIN
        value: "false"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PLANS_ENABLED
        value: "false"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: ADMIN_NOTIFY_EMAIL
        sync: false
      - key: PLAUSIBLE_SITE
        value: ravnopar.oriph.io
      - key: PLAUSIBLE_API_KEY
        sync: false
      - key: PLAUSIBLE_SHARED_DASHBOARD_URL
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: S3_REGION
        value: auto

  - type: web
    name: ravnopar
    runtime: static
    plan: free
    region: frankfurt
    branch: main
    rootDir: ravnopar/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ravnopar-backend.onrender.com/api
      - key: VITE_SITE_URL
        value: https://ravnopar.oriph.io
      - key: VITE_CONTACT_EMAIL
        sync: false
      - key: VITE_PLANS_ENABLED
        value: "false"
      - key: VITE_ANALYTICS_URL
        sync: false
      - key: VITE_TURNSTILE_SITE_KEY
        sync: false
